<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Maryam Batool">
  <title>Temperature Converter | Maryam Batool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Animated background -->
  <div class="bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <main class="card">
    <header class="card-head">
      <span class="badge">Project by Maryam Batool</span>
      <button type="button" id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <h1>Temperature Converter</h1>
    <p class="intro">Enter a temperature, choose its unit, and see it in all three scales.</p>

    <form id="converter-form" novalidate>
      <div class="field">
        <label for="temp-input">Temperature</label>
        <div class="input-wrap" id="input-wrap">
          <input type="text" id="temp-input" inputmode="decimal" autocomplete="off"
                 placeholder="e.g. 36.6" aria-describedby="error-msg" aria-invalid="false">
        </div>
        <p id="error-msg" class="error" role="alert" aria-live="polite"></p>
      </div>

      <fieldset class="field units">
        <legend>Convert from</legend>
        <label class="unit-option">
          <input type="radio" name="unit" value="C" checked>
          <span>Celsius <b>°C</b></span>
        </label>
        <label class="unit-option">
          <input type="radio" name="unit" value="F">
          <span>Fahrenheit <b>°F</b></span>
        </label>
        <label class="unit-option">
          <input type="radio" name="unit" value="K">
          <span>Kelvin <b>K</b></span>
        </label>
      </fieldset>

      <button type="submit" id="convert-btn" class="primary">
        <span>Convert</span>
      </button>
    </form>

    <section id="results" class="results" aria-live="polite" hidden>
      <div class="thermo" aria-hidden="true">
        <div class="thermo-tube"><div class="thermo-fill" id="thermo-fill"></div></div>
        <div class="thermo-bulb"></div>
      </div>
      <dl>
        <div class="row" data-unit="C">
          <dt>Celsius</dt>
          <dd id="out-C">–</dd>
        </div>
        <div class="row" data-unit="F">
          <dt>Fahrenheit</dt>
          <dd id="out-F">–</dd>
        </div>
        <div class="row" data-unit="K">
          <dt>Kelvin</dt>
          <dd id="out-K">–</dd>
        </div>
      </dl>
    </section>
    <p id="notice" class="notice" hidden></p>

    <footer class="card-foot">
      Designed &amp; developed by <strong>Maryam Batool</strong>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
